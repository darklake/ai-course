<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 500px; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; color: var(--primary-color); }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; }
        input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1rem; outline: none;
        }
        input[type="number"]:focus { border-color: var(--primary-color); }
        .upload-section { text-align: center; }
        .file-label {
            display: inline-block; padding: 12px 24px; background-color: var(--primary-color);
            color: white; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;
        }
        input[type="file"] { display: none; }
        #status-msg { margin-top: 10px; font-size: 0.9rem; font-weight: bold; min-height: 1.2em; }
        .status-reading { color: var(--primary-color); }
        .status-error { color: var(--error-color); }
        .result-card { background: var(--primary-color); color: white; text-align: center; }
        .result-card .label { font-size: 1rem; opacity: 0.9; }
        .result-card .value { font-size: 2.5rem; font-weight: bold; margin-top: 5px; }
        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .item-list li:last-child { border-bottom: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>💸 나눠 내기 계산기</h1>
    <div class="card">
        <div class="input-group">
            <label for="total-amount">총 금액 (원)</label>
            <input type="number" id="total-amount" placeholder="0" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="people-count">인원 수 (명)</label>
            <input type="number" id="people-count" value="1" min="1" inputmode="numeric">
        </div>
    </div>
    <div class="card upload-section">
        <label class="file-label" for="receipt-upload">📷 영수증 사진 올리기</label>
        <input type="file" id="receipt-upload" accept="image/*">
        <div id="status-msg"></div>
    </div>
    <div class="card" id="analysis-result-card" style="display: none;">
        <h3 style="margin-top: 0; font-size: 1.1rem;">🧾 분석된 항목</h3>
        <ul id="item-list" class="item-list"></ul>
    </div>
    <div class="card result-card">
        <div class="label">1인당 내야 할 금액</div>
        <div id="per-person-amount" class="value">0원</div>
    </div>
</div>
<script>
    async function ask(prompt, imageUrl) {
        const content = [{ type: "text", text: prompt }];
        if (imageUrl) content.push({ type: "image_url", image_url: { url: imageUrl } });
        const r = await fetch("https://krchoi.com/gemma4/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "gemma4", messages: [{ role: "user", content: content }] })
        });
        const data = await r.json();
        return data.choices[0].message.content;
    }
    function parseJson(text) {
        const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
        try { return JSON.parse(m ? m[1] : text); } catch (e) { return null; }
    }
    function shrinkImage(file, maxSize = 1280) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL("image/jpeg", 0.85));
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    const totalAmountInput = document.getElementById('total-amount');
    const peopleCountInput = document.getElementById('people-count');
    const perPersonDisplay = document.getElementById('per-person-amount');
    const receiptUpload = document.getElementById('receipt-upload');
    const statusMsg = document.getElementById('status-msg');
    const itemListEl = document.getElementById('item-list');
    const analysisCard = document.getElementById('analysis-result-card');

    function calculate() {
        const total = parseInt(totalAmountInput.value) || 0;
        const people = parseInt(peopleCountInput.value) || 1;
        const perPerson = Math.floor(total / (people > 0 ? people : 1));
        perPersonDisplay.textContent = perPerson.toLocaleString() + "원";
    }

    totalAmountInput.addEventListener('input', calculate);
    peopleCountInput.addEventListener('input', calculate);

    receiptUpload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        statusMsg.textContent = "읽는 중...";
        statusMsg.className = "status-reading";
        itemListEl.innerHTML = "";
        analysisCard.style.display = "none";

        try {
            const base64Image = await shrinkImage(file);
            const prompt = "영수증 이미지에서 항목 이름과 금액을 추출해서 JSON 형식으로만 응답해줘. 형식은 [{\"item\": \"항목명\", \"price\": 금액}, ...] 형태여야 해. 다른 설명은 하지 마.";
            const responseText = await ask(prompt, base64Image);
            const items = parseJson(responseText);

            if (items && Array.isArray(items)) {
                let totalSum = 0;
                items.forEach(item => {
                    const li = document.createElement('li');
                    const price = parseInt(item.price) || 0;
                    totalSum += price;
                    li.innerHTML = `<span>${item.item}</span><span>${price.toLocaleString()}원</span>`;
                    itemListEl.appendChild(li);
                });
                analysisCard.style.display = "block";
                totalAmountInput.value = totalSum;
                calculate();
                statusMsg.textContent = "";
                statusMsg.className = "";
            } else {
                throw new Error("Invalid JSON");
            }
        } catch (err) {
            statusMsg.textContent = "읽지 못했습니다";
            statusMsg.className = "status-error";
        }
    });
</script>
</body>
</html>
